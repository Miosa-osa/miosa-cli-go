version: 2

project_name: miosa

before:
  hooks:
    - go mod tidy

builds:
  - id: miosa
    main: ./cmd/miosa
    binary: miosa
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X 'github.com/Miosa-osa/miosa-cli-go/commands.cliVersion={{.Version}}'

archives:
  - id: miosa
    ids:
      - miosa
    name_template: "miosa_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

homebrew_casks:
  - name: miosa
    ids:
      - miosa
    binaries:
      - miosa
    repository:
      owner: Miosa-osa
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    # Without a tap token the archives still publish; the tap is updated by PR.
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}' 
    commit_author:
      name: miosa-releasebot
      email: releases@miosa.ai
    homepage: "https://miosa.ai"
    description: "Official CLI for MIOSA sandboxes"
    license: "MIT"
    # The binary is not notarized yet; clear the quarantine flag on install.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/miosa"]
          end
